# Local cloud simulation stack
# Simulates: FastAPI backend + PostgreSQL + MinIO (S3-compatible)
# Usage:
#   docker compose up          -> starts all services
#   docker compose down -v     -> stops and deletes all volumes (clean slate)

services:

  # ─── Backend ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carteiraconsol_backend
    env_file: .env.docker
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - carteiraconsol

  # ─── PostgreSQL ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: carteiraconsol_postgres
    environment:
      POSTGRES_USER: carteira
      POSTGRES_PASSWORD: carteira
      POSTGRES_DB: carteira_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carteira -d carteira_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - carteiraconsol

  # ─── MinIO (S3-compatible local) ─────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: carteiraconsol_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO console (browser)
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - carteiraconsol

  # ─── MinIO bucket bootstrap ──────────────────────────────────────────────
  minio_setup:
    image: minio/mc:latest
    container_name: carteiraconsol_minio_setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/carteiraconsol-raw;
        mc anonymous set download local/carteiraconsol-raw;
        echo 'MinIO bucket ready.';
      "
    networks:
      - carteiraconsol

volumes:
  postgres_data:
  minio_data:

networks:
  carteiraconsol:
    driver: bridge
